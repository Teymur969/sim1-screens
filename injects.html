:root{
  --ink:#0D0C4E; --ink2:#2B2F45; --mute:#516578; --mute2:#7B8798;
  --bg:#FFFFFF; --bg2:#F6F7FA; --rule:#DDE2EA; --rule2:#CDD5E2;
  --pink:#EE4D9B; --pinkL:#FDE6F1; --lilac:#7781B8; --lilacL:#E9EBF6; --teal:#0E8C80; --tealL:#DDF1EE;
  --amber:#E08A1E; --amberL:#FCEFD9; --red:#D7263D; --redL:#FBE3E6;
  --display:"Expo BG","Axiforma",system-ui,sans-serif;
  --body:"Axiforma",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg2);font-size:14px;line-height:1.35}
button{font-family:inherit;font-size:13px;font-weight:700;border:1px solid var(--rule2);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
button.ink{background:var(--ink);border-color:var(--ink);color:#fff}
button.pink{background:var(--pink);border-color:var(--pink);color:#fff}
button.teal{background:var(--teal);border-color:var(--teal);color:#fff}
button.amber{background:var(--amber);border-color:var(--amber);color:#fff}
button.ghost{background:transparent;border-color:transparent;color:var(--mute);font-weight:600}
button.ghost:hover{color:var(--ink);border-color:var(--rule2)}
button.sm{padding:5px 9px;font-size:12px;border-radius:8px}
button.big{padding:13px 16px;font-size:15px}
input[type=text],input[type=password],input[type=search],textarea,select{font-family:inherit;font-size:14px;border:1px solid var(--rule2);border-radius:10px;padding:9px 11px;color:var(--ink);background:#fff;width:100%}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 6px}
.muted{color:var(--mute);font-size:12px}
.sp{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
header img{height:34px}
header h1{font-size:17px;line-height:1.15}
header h1 small{display:block;font-size:12px;font-weight:400;color:var(--mute)}
.hclock{text-align:right;line-height:1.05}
.hclock b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.hclock span{display:block;font-size:11px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px;background:#E6E9EF;color:var(--mute);white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:#9AA3B2}
.pill.ok{background:var(--tealL);color:var(--teal)}.pill.ok i{background:var(--teal)}
.pill.bad{background:var(--redL);color:var(--red)}.pill.bad i{background:var(--red)}
.pill.live{background:var(--pink);color:#fff}.pill.live i{background:#fff}
.pill.paused{background:var(--amber);color:#fff}.pill.paused i{background:#fff}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:2px 7px;font-size:11px;font-weight:700;background:var(--lilacL);color:var(--ink);white-space:nowrap}
.chip.f1{background:#FFE9D6}.chip.f2{background:#E0F0FF}.chip.f3{background:#E7F6E3}.chip.f5{background:#F1E7FB}.chip.f7{background:#FDE6F1}.chip.f71{background:#DDF3F1}.chip.tv{background:#fff;border:1.5px dashed #7781B8;color:#3B437A}.chip.f72{background:#FFF3C4}.chip.f73{background:#E4E7FB}
.chip.pa{background:var(--ink);color:#fff}.chip.pb{background:#E6E9EF;color:var(--mute)}
.chip.st-queued{background:#E6E9EF;color:var(--mute)}
.chip.st-released{background:var(--amberL);color:#9A5A08}
.chip.st-inplay{background:var(--lilacL);color:var(--ink)}
.chip.st-closing{background:var(--pinkL);color:#A8216A}
.chip.st-closed{background:var(--tealL);color:var(--teal)}
.chip.st-skipped{background:#EEE;color:#888;text-decoration:line-through}
.id{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;min-width:42px;display:inline-block}

/* control layout */
.stats{display:flex;gap:10px;padding:12px 18px 0;flex-wrap:wrap;align-items:center}
.stat{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:8px 14px;min-width:96px}
.stat b{font-family:var(--display);font-size:22px;display:block;line-height:1}
.stat span{font-size:11px;color:var(--mute)}
.stat.hot{border-color:var(--pink);background:var(--pinkL)}
.online{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.online .chip{background:#fff;border:1px solid var(--rule)}
.online .chip i{width:8px;height:8px;border-radius:50%;background:#C3C9D3}
.online .chip.on i{background:var(--teal)}
.cols{display:grid;grid-template-columns:minmax(340px,1fr) minmax(360px,1.15fr) minmax(320px,.95fr);gap:14px;padding:12px 18px 30px;align-items:start}
.box{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:14px}
.box>h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.box>h2 .sp{flex:1}
.scroll{max-height:calc(100vh - 230px);overflow:auto;margin:0 -6px;padding:0 6px}
.qrow{display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:start;padding:9px 8px;border-radius:10px;border:1px solid transparent}
.qrow+.qrow{border-top-color:var(--rule)}
.qrow .t{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.qrow .t small{display:block;font-family:var(--body);font-size:10px;color:var(--mute2)}
.qrow .ti{font-weight:700;font-size:13px}
.qrow .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;align-items:center}
.qrow .act{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.qrow.due{background:var(--amberL)}
.qrow.late{background:var(--redL)}
.qrow.next{border-color:var(--rule2)}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.badge.due{background:var(--amber);color:#fff}.badge.late{background:var(--red);color:#fff}.badge.soon{background:#E6E9EF;color:var(--mute)}
select.sm{padding:4px 6px;font-size:12px;border-radius:8px;width:auto}
.grp{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
.grp:first-child{margin-top:0}
.card{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;background:#fff}
.card+.card{margin-top:8px}
.card.closing{border-color:var(--pink);background:var(--pinkL)}
.card.wait{border-color:#F1C98E}
.card.wait.old{border-color:var(--red);background:var(--redL)}
.card .top{display:flex;gap:8px;align-items:center}
.card .ti{font-weight:700;margin-top:3px}
.card .times{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--ink2)}
.card .times span b{font-variant-numeric:tabular-nums}
.card .times .no{color:var(--mute2)}
.card .last{margin-top:6px;font-size:12px;color:var(--ink2);background:var(--bg2);border-radius:8px;padding:6px 8px}
.card .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.feed .ev{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:7px 4px;border-top:1px solid var(--rule);font-size:12px}
.feed .ev:first-child{border-top:0}
.feed .ev b.tm{font-variant-numeric:tabular-nums}
.feed .ev .who{color:var(--mute)}
.feed .ev.new{animation:flash 2.5s ease-out}
@keyframes flash{from{background:var(--amberL)}to{background:transparent}}
.empty{color:var(--mute2);font-size:13px;padding:10px 4px}
details>summary{cursor:pointer;font-weight:700;font-size:12px;color:var(--mute);padding:6px 0}

/* floor layout */
.fwrap{max-width:780px;margin:0 auto;padding:14px 14px 60px}
.fsec{margin-top:16px}
.fsec>h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.fsec>h2 .n{background:var(--ink);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;letter-spacing:0}
.fcard{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:14px}
.fcard+.fcard{margin-top:10px}
.fcard.todo{border:2px solid var(--amber)}
.fcard .ti{font-size:16px;font-weight:700;margin:4px 0 2px}
.fcard .where{font-size:13px;color:var(--ink2)}
.fcard .kv{font-size:12px;color:var(--ink2);margin-top:6px}
.fcard .kv b{color:var(--ink)}
.fcard .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fcard .btns button{flex:1;min-width:120px}
.note{background:var(--amberL);border-radius:8px;padding:6px 9px;font-size:12px;margin-top:8px}

/* scenario list (floor view) */
.slist{max-height:65vh;overflow:auto;background:#fff;border:1px solid var(--rule);border-radius:14px;margin-top:8px}
.srow{display:grid;grid-template-columns:52px 46px 1fr auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--rule);cursor:pointer}
.srow:hover{background:var(--bg2)}
.srow .t{font-variant-numeric:tabular-nums;font-weight:700}
.srow .ti{font-size:13px}
.srow .ti small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.srow .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.srow.done{opacity:.55}
.srow.live{background:#FFFBF2}
.sph{position:sticky;top:0;background:var(--bg2);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:6px 12px;border-top:1px solid var(--rule);z-index:1}
.sbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sbar .opts button{padding:5px 10px}
.masked{color:var(--mute2);font-style:italic}
@media (max-width:600px){.srow{grid-template-columns:44px 40px 1fr}.srow .r{grid-column:2 / 4;flex-direction:row;justify-content:flex-start}}
/* modal */
.mask{position:fixed;inset:0;background:rgba(13,12,78,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow:auto;padding:28px 12px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:18px;margin-bottom:4px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{font-weight:600;font-size:12px;padding:6px 10px;border-radius:999px}
.opts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.opts .gl{width:100%;font-size:11px;color:var(--mute);margin-top:4px}
.pop .modal{border:4px solid var(--amber)}
.pop h3{font-size:22px;line-height:1.25;margin-top:4px}.pop h3 .id{font-family:var(--display);font-size:30px;display:block;margin-bottom:2px}
.kvt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.kvt td{padding:5px 0;border-top:1px solid var(--rule);vertical-align:top}
.kvt td:first-child{width:130px;color:var(--mute);font-size:12px}
.log .ev{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--rule);font-size:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;transition:transform .25s;z-index:200;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--red)}
.gate{max-width:440px;margin:60px auto;background:#fff;border:1px solid var(--rule);border-radius:16px;padding:24px}
.gate h2{font-size:20px;margin-bottom:4px}
.gate img{height:40px;margin-bottom:14px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
@media (max-width:1100px){.cols{grid-template-columns:1fr}.scroll{max-height:none}}
@media (max-width:600px){header{gap:10px;padding:8px 10px}header img{display:none}.hclock b{font-size:22px}.hide-s{display:none}}
.chip.wl{background:#EE4D9B;color:#fff;border-color:#EE4D9B}
</style>
</head>
<body>
<div id="app"></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="mask pop" id="pmask"><div class="modal" id="pmodal"></div></div>
<div class="toast" id="toast"></div>

function fmtT(iso, sec) {
  if (!iso) return "";
  try { return new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", second: sec ? "2-digit" : undefined, timeZone: "Europe/Belgrade" }); }

function FNs(a) { return (a || []).map(FN).join(", "); }

const SND = {

/* ---- demo backend (dummy injects, this browser only) ---- */
function demoBackend() {
  const KEY = "inj1-demo-db", bc = "BroadcastChannel" in window ? new BroadcastChannel("inj1-demo") : null;
  function blank() { return { seq: 0, injects: DEMO_INJECTS.map((x) => Object.assign({ status: "queued", adhoc: false, priority: null, wall: false, involved: x.floors.slice(), travel: [] }, x)), events: [] }; }
  function read() { try { return JSON.parse(localStorage.getItem(KEY)) || blank(); } catch (e) { return blank(); } }
  function write(db) { localStorage.setItem(KEY, JSON.stringify(db)); if (bc) bc.postMessage("x"); }
  const merge = (a, b) => Array.from(new Set((a || []).concat(b || []).filter((x) => x != null))).sort((p, q) => p - q);
  API.check = async (pin) => (pin === "control" || pin === "demo-control" ? "control" : pin ? "floor" : null);
  API.fetch = async () => { const db = read(); return { now: Date.now(), injects: db.injects.slice().sort((a, b) => (a.sim_min || 9999) - (b.sim_min || 9999) || a.ord - b.ord), events: db.events }; };
  API.act = async (role, action, id, floor, actor, d) => {
    d = d || {}; const db = read(); const now = new Date().toISOString();
    const ctl = ["release", "unrelease", "skip", "unskip", "close", "reopen", "priority", "wall", "adhoc", "editnote", "note", "travel"];
    if (ctl.indexOf(action) >= 0 && role !== "control") throw new Error("Only SIM Control can do this");
    if (action === "adhoc") {
      id = "X" + (db.injects.filter((x) => x.adhoc).length + 1);
      const f = d.floor ? [+d.floor] : [];
      db.injects.push({ id, ord: 9000, phase: d.phase || "Ad hoc", sim: d.sim || null, sim_min: d.simMin ? +d.simMin : null, title: d.title || "Ad hoc inject", space: d.floor ? "Floor " + d.floor : null, floors: f, lead: d.lead || "", support: d.support || "", note: d.note || "", adhoc: true, status: "queued", involved: f });
    }
    const i = db.injects.find((x) => x.id === id); if (!i) throw new Error("Unknown inject " + id);
    if (action === "release") { if (["queued", "released"].indexOf(i.status) < 0) throw new Error("Inject " + id + " is already " + i.status); const tf = d.floor ? +d.floor : i.floors[0]; if (!tf) throw new Error("Choose a floor first"); i.status = "released"; i.rel_floor = tf; i.released_at = i.released_at || now; i.involved = merge(i.involved, i.floors.concat([tf])); floor = tf; }
    else if (action === "unrelease") { if (i.status !== "released") throw new Error("Only a released inject that is not yet delivered can go back"); i.status = "queued"; i.rel_floor = null; i.released_at = null; }
    else if (action === "skip") { if (["queued", "released"].indexOf(i.status) < 0) throw new Error("Inject " + id + " is already in play"); i.status = "skipped"; }
    else if (action === "unskip") { if (i.status === "skipped") { i.status = "queued"; i.rel_floor = null; i.released_at = null; } }
    else if (action === "deliver") { if (["released", "inplay"].indexOf(i.status) < 0) throw new Error("Inject " + id + " has not been released"); i.status = "inplay"; i.delivered_at = i.delivered_at || now; i.delivered_by = actor || i.delivered_by; i.delivered_to = d.to || null; i.delivered_how = d.method || "Face to face"; i.involved = merge(i.involved, [floor || i.rel_floor]); }
    else if (action === "update") { if (i.status === "queued") throw new Error("Inject " + id + " has not been released"); i.involved = merge(i.involved, [floor, d.targetFloor ? +d.targetFloor : null]); }
    else if (action === "moc") { i.moc_at = i.moc_at || now; }
    else if (action === "suggest") { if (["inplay", "released"].indexOf(i.status) < 0) throw new Error("Inject " + id + " is not in play"); i.status = "closing"; i.closing_at = now; }
    else if (action === "close") { i.status = "closed"; i.closed_at = now; }
    else if (action === "reopen") { if (["closed", "closing"].indexOf(i.status) >= 0) { i.status = i.delivered_at ? "inplay" : "released"; i.closed_at = null; i.closing_at = null; } }
    else if (action === "priority") { i.priority = d.p || null; }
    else if (action === "wall") { i.wall = !!d.on; }
    else if (action === "editnote") { i.note = d.note || ""; }
    else if (action === "travel") { i.travel = Array.from(new Set((d.floors || []).map(Number).filter((n) => n))).sort((p, q) => p - q); }
    i.updated_at = now;
    db.seq++;
    db.events.push({ id: db.seq, inject_id: i.id, at: now, game: d.game || null, role, floor: floor == null ? null : floor, actor, kind: action, method: d.method || null, target: d.target || d.to || null, target_floor: d.targetFloor ? +d.targetFloor : null, body: d.body || d.note || d.p || d.title || null });
    write(db); return i;
  };
  // Exercise clock: use the floor screens demo clock if it is in this browser, else a dummy clock.
  function clockRead() {
    try { const s = JSON.parse(localStorage.getItem("sim1-demo-state")); if (s && s.clock && s.clock.realAnchor) return s; } catch (e) {}
    let c = null; try { c = JSON.parse(localStorage.getItem("inj1-demo-clock")); } catch (e) {}
    if (!c) { c = { status: "live", clock: { gameMin: 535, realAnchor: Date.now(), speed: 5, running: true } }; localStorage.setItem("inj1-demo-clock", JSON.stringify(c)); }
    return c;
  }
  API.start = () => {
    API.clock = clockRead(); if (API.onClock) API.onClock();
    if (bc) bc.onmessage = () => API.onChange && API.onChange();
    window.addEventListener("storage", (e) => { if (e.key === KEY && API.onChange) API.onChange(); if (e.key === "sim1-demo-state") { API.clock = clockRead(); API.onClock && API.onClock(); } });
    setTimeout(() => setStatus(true, "Demo mode"), 0);
  };
  API.track = () => {};
  API.reset = () => { localStorage.removeItem(KEY); localStorage.removeItem("inj1-demo-clock"); if (bc) bc.postMessage("x"); };
}

/* ---- live backend (Supabase) ---- */
function liveBackend() {
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: false, autoRefreshToken: false }, realtime: { params: { eventsPerSecond: 10 } } });
  let pin = "", presenceCh = null, meta = null;
  API.setPin = (p) => (pin = p);
  API.check = async (p) => { const { data, error } = await sb.rpc("inj_check", { p_pin: p }); if (error) throw new Error(error.message); return data; };
  API.fetch = async () => {
    const t0 = Date.now();
    const { data, error } = await sb.rpc("inj_fetch", { p_pin: pin });
    const t1 = Date.now();
    if (error) throw new Error(error.message);
    if (data && data.now && t1 - t0 < 3000) { const off = Number(data.now) + (t1 - t0) / 2 - t1; API.offset = API.offset ? API.offset * 0.7 + off * 0.3 : off; }
    return data;
  };
  API.act = async (role, action, id, floor, actor, d) => {
    const { data, error } = await sb.rpc("inj_act", { p_pin: pin, p_action: action, p_id: id, p_floor: floor, p_actor: actor, p_data: d || {} });
    if (error) throw new Error(error.message);
    return data;
  };
  async function readClock() {
    const { data, error } = await sb.from("sim_state").select("state").eq("id", 1).single();
    if (!error && data && data.state) { API.clock = data.state; if (API.onClock) API.onClock(); }
  }
  API.start = () => {
    sb.channel("inj-tick")
      .on("postgres_changes", { event: "*", schema: "public", table: "inj_tick" }, () => API.onChange && API.onChange())
      .on("postgres_changes", { event: "*", schema: "public", table: "sim_state", filter: "id=eq.1" }, (p) => { if (p.new && p.new.state) { API.clock = p.new.state; API.onClock && API.onClock(); } })
      .subscribe((s) => {
        if (s === "SUBSCRIBED") { setStatus(true, "Live"); readClock(); API.onChange && API.onChange(); }
        else if (s === "CHANNEL_ERROR" || s === "TIMED_OUT" || s === "CLOSED") setStatus(false, "Reconnecting");
      });
    readClock();
    // Safety net if realtime is blocked: poll every 4 s while disconnected, every 15 s otherwise.
    let last = 0;
    setInterval(() => { const gap = API.connected ? 15000 : 4000; if (Date.now() - last >= gap) { last = Date.now(); API.onChange && API.onChange(); readClock(); } }, 1000);
    window.addEventListener("online", () => API.onChange && API.onChange());
    document.addEventListener("visibilitychange", () => { if (!document.hidden && API.onChange) API.onChange(); });
  };
  API.track = (m) => {
    meta = Object.assign({ id: API.clientId }, m);
    if (presenceCh) { presenceCh.track(meta); return; }
    presenceCh = sb.channel("inj-presence", { config: { presence: { key: API.clientId } } });
    presenceCh.on("presence", { event: "sync" }, () => {
      const st = presenceCh.presenceState(), list = [];
      Object.keys(st).forEach((k) => st[k].forEach((x) => list.push(x)));
      if (API.onPresence) API.onPresence(list);
    }).subscribe((s) => { if (s === "SUBSCRIBED") presenceCh.track(meta); });
  };
}
if (DEMO) demoBackend(); else liveBackend();

/* ---------------------------------------------------------------- app state */
const ME = { role: null, view: null, floor: null, name: "", pin: "" };
let DB = { injects: [], events: [], by: {} }, lastEv = -1, booted = false, busy = false, again = false, presence = [];
let openDetail = null, newEvIds = new Set();

async function refresh() {
  if (busy) { again = true; return; }
  busy = true;
  try {
    const d = await API.fetch();
    const by = {}; (d.injects || []).forEach((x) => (by[x.id] = x));
    const evs = d.events || [];
    const fresh = lastEv < 0 ? [] : evs.filter((e) => e.id > lastEv);
    DB = { injects: d.injects || [], events: evs, by };
    lastEv = evs.length ? Math.max.apply(null, evs.map((e) => e.id)) : Math.max(lastEv, 0);
    fresh.forEach((e) => newEvIds.add(e.id));
    notify(fresh);
    render();
  } catch (e) {
    if (/pin/i.test(e.message)) { forget(); location.reload(); return; }
    setStatus(false, "Cannot read data");
  } finally {
    busy = false;
    if (again) { again = false; refresh(); }
  }
}
let tickTimer = null;
API.onChange = () => { clearTimeout(tickTimer); tickTimer = setTimeout(refresh, 150); };
API.onClock = () => drawClock();
API.onPresence = (l) => { presence = l; if (ME.view === "control") drawOnline(); };
API.onStatus = (ok, note) => { const p = $("conn"); if (p) { p.className = "pill " + (ok ? "ok" : "bad"); p.lastChild.textContent = note || (ok ? "Live" : "Offline"); } };

function gameStr() { const g = API.gameMin(); return g == null ? null : fmtGame(g); }
async function act(action, id, data, floor) {
  data = Object.assign({ game: gameStr() }, data || {});
  try {
    const r = await API.act(ME.role, action, id, floor === undefined ? (ME.view === "floor" ? ME.floor : null) : floor, ME.name, data);
    refresh(); return r || true;
  } catch (e) { toast("Not saved: " + e.message, true); return null; }
}
function evsFor(id) { return DB.events.filter((e) => e.inject_id === id); }
function lastUpdate(id) { const l = evsFor(id).filter((e) => ["update", "deliver", "suggest", "note", "close"].indexOf(e.kind) >= 0); return l[l.length - 1]; }
function countUpdates(id) { return evsFor(id).filter((e) => e.kind === "update").length; }

function evText(e) {

/* ---------------------------------------------------------------- notifications */
function notify(fresh) {
  if (!booted) return;
  fresh.forEach((e) => {
    const i = DB.by[e.inject_id]; if (!i) return;
    if (ME.view === "floor") {
      const mine = e.actor === ME.name && e.floor === ME.floor;
      if (e.kind === "release" && e.floor === ME.floor) { POP.push(i.id); }
      else if (e.kind === "release" && (i.travel || []).indexOf(ME.floor) >= 0) { toast("Inject " + i.id + " started on " + FN(e.floor) + ". It is expected to come to your floor."); SND.play("soft"); }
      else if (e.kind === "travel" && (i.travel || []).indexOf(ME.floor) >= 0 && ["released", "inplay", "closing"].indexOf(i.status) >= 0 && i.rel_floor !== ME.floor) { toast("Inject " + i.id + " is now expected to come to your floor."); SND.play("soft"); }
      else if (e.kind === "release" && (i.floors || []).indexOf(ME.floor) >= 0) { toast("Inject " + i.id + " went to " + FN(e.floor) + ". It may reach your desk."); SND.play("soft"); }
      else if (e.kind === "update" && e.target_floor === ME.floor && !mine) { toast((e.floor ? FN(e.floor) : "Another floor") + ": the player contacted " + (e.target || "your floor") + " about inject " + i.id + "."); SND.play("soft"); }
      else if (e.kind === "close" && (i.involved || []).indexOf(ME.floor) >= 0) { toast("SIM Control closed inject " + i.id + "."); SND.play("soft"); }
    } else {
      if (e.role === "floor" && e.kind === "suggest") { toast(FN(e.floor) + " asks to close inject " + i.id + "."); SND.play("soft"); }
      else if (e.role === "floor" && e.kind === "deliver") { SND.play("soft"); }
    }
  });
  if (ME.view === "floor") showPop();
}

function suggestModal(id) {

  $("sGo").onclick = async () => { $("sGo").disabled = true; const r = await act("suggest", id, { body: $("sBody").value.trim() }); if (r) { closeModal(); toast("Close request sent to SIM Control."); } else $("sGo").disabled = false; };

function closeModalFor(id) {

    '<table class="kvt">' +
    "<tr><td>Exercise time</td><td>" + H(i.sim || "") + (i.mel_real ? ' <span class="muted">(MEL real time ' + H(i.mel_real) + ")</span>" : "") + "</td></tr>" +

    "<tr><td>Lead department</td><td><b>" + H(i.lead || "") + "</b></td></tr>" +
    "<tr><td>Also involved</td><td>" + H(i.support || "") + "</td></tr>" +
    "<tr><td>Times</td><td>Released " + (fmtT(i.released_at) || "-") + (i.rel_floor ? " to " + FN(i.rel_floor) : "") + " · Delivered " + (fmtT(i.delivered_at) || "-") + " · MOC informed " + (fmtT(i.moc_at) || "-") + " · Closed " + (fmtT(i.closed_at) || "-") + "</td></tr>" +

    "<tr><td>Floors involved</td><td>" + ((i.involved || []).map(floorChip).join(" ") || "-") + "</td></tr>" +
    "<tr><td>Expected to travel to</td><td>" + (travelChips(i) || "-") + "</td></tr>" +

    $("eLogGo").onclick = async () => { const v = $("eLog").value.trim(); if (!v) return; const r = await act("note", id, { body: v }); if (r) { $("eLog").value = ""; toast("Added to the log."); } };
  }

/* ---------------------------------------------------------------- clock */
function drawClock() {
  const g = API.gameMin(), st = API.status();
  const a = $("hgame"); if (a) a.textContent = fmtGame(g);
  const r = $("hreal"); if (r) r.textContent = fmtT(new Date(API.now()).toISOString());
  const p = $("stpill");
  if (p) { p.className = "pill " + (st === "live" ? "live" : st === "paused" ? "paused" : ""); p.lastChild.textContent = st === "unknown" ? "Clock not found" : st.charAt(0).toUpperCase() + st.slice(1); }
}
setInterval(drawClock, 500);

/* ---------------------------------------------------------------- render */
function render() {
  if (!booted) return;
  if (ME.view === "control") renderControl(); else renderFloor();
  if (openDetail && $("mask").classList.contains("on") && DB.by[openDetail]) {
    const ta = document.activeElement; if (!ta || (ta.id !== "eLog")) detailModal(openDetail);
  }
}
setInterval(() => { if (booted && !document.hidden) render(); }, 10000);

/* ---- SIM Control ---- */
const CTL = { phase: "all", hideB: false, q: "", feedFloor: "all", built: false };
function renderControl() {
  if (!CTL.built) {
    $("app").innerHTML = headerHtml("SIM1 inject control", H(ME.name) + (DEMO ? " · Demo mode with dummy injects" : "")) +
      '<div class="stats" id="stats"></div>' +
      '<div class="cols">' +
      '<div class="box"><h2>Queue<span class="sp"></span><select class="sm" id="fPhase"><option value="all">All phases</option><option>Phase 1</option><option>Phase 2</option><option>Ad hoc</option>' + (DEMO ? "<option>Demo</option>" : "") + '</select><label class="muted" style="text-transform:none;letter-spacing:0"><input type="checkbox" id="fB"> Hide B</label></h2>' +
      '<input type="search" id="fQ" placeholder="Search ID, title or department" style="margin-bottom:8px"><div class="scroll" id="queue"></div></div>' +
      '<div class="box"><h2>Live board<span class="sp"></span><span class="muted" style="text-transform:none;letter-spacing:0" id="liveN"></span></h2><div class="scroll" id="live"></div></div>' +
      '<div class="box"><h2>Feed<span class="sp"></span><select class="sm" id="fFloor"><option value="all">All floors</option>' + CFG.FLOORS.map((f) => '<option value="' + f.n + '">' + H(FN(f.n)) + "</option>").join("") + '</select></h2><div class="scroll feed" id="feed"></div></div>' +
      "</div>";
    $("fPhase").onchange = (e) => { CTL.phase = e.target.value; renderControl(); };
    $("fB").onchange = (e) => { CTL.hideB = e.target.checked; renderControl(); };
    $("fQ").oninput = (e) => { CTL.q = e.target.value.toLowerCase(); renderControl(); };
    $("fFloor").onchange = (e) => { CTL.feedFloor = e.target.value; renderControl(); };
    $("app").addEventListener("click", ctlClick);
    $("app").addEventListener("change", (e) => { if (e.target.dataset.relfloor) CTL["rf_" + e.target.dataset.relfloor] = e.target.value; });
    CTL.built = true; API.onStatus(API.connected, API.connected ? (DEMO ? "Demo mode" : "Live") : "Connecting"); drawClock();
  }
  const I = DB.injects, g = API.gameMin();
  const cnt = (s) => I.filter((x) => x.status === s).length;
  $("stats").innerHTML =
    [["queued", "Queued"], ["released", "Waiting for delivery"], ["inplay", "In play"], ["closing", "Close requested"], ["closed", "Closed"], ["skipped", "Skipped"]]
      .map(([s, l]) => '<div class="stat' + (s === "closing" && cnt(s) ? " hot" : "") + '"><b>' + cnt(s) + "</b><span>" + l + "</span></div>").join("") +
    '<button class="ink" data-c="adhoc">Ad hoc inject</button><button data-c="export">Export to Excel</button><button class="ghost" data-c="sound">' + (SND.on ? "Sound on" : "Sound off") + "</button>" +
    (DEMO ? '<button class="ghost" data-c="reset">Reset demo</button>' : "") +
    '<div class="online" id="online"></div>';
  drawOnline();

  // queue
  const match = (x) => !CTL.q || (x.id + " " + x.title + " " + (x.lead || "") + " " + (x.support || "")).toLowerCase().indexOf(CTL.q) >= 0;
  const q = I.filter((x) => x.status === "queued" && (CTL.phase === "all" || x.phase === CTL.phase) && !(CTL.hideB && x.priority === "B") && match(x));
  let firstNext = true;
  $("queue").innerHTML = q.length ? q.map((x) => {
    let cls = "", badge = "";
    if (g != null && x.sim_min != null) {
      const d = x.sim_min - g;
      if (d <= -CFG.LATE_AFTER) { cls = "late"; badge = '<span class="badge late">Late ' + Math.round(-d) + " min</span>"; }
      else if (d <= CFG.DUE_BEFORE) { cls = "due"; badge = '<span class="badge due">Due now</span>'; }
      else if (d <= 60) { badge = '<span class="badge soon">In ' + Math.round(d) + " min</span>"; if (firstNext) { cls = "next"; firstNext = false; } }
    }
    const fl = x.floors || [];
    const pick = fl.length > 1 || x.adhoc || !fl.length
      ? '<select class="sm" data-relfloor="' + H(x.id) + '">' + (fl.length ? fl : []).concat(CFG.FLOORS.map((f) => f.n).filter((n) => fl.indexOf(n) < 0)).map((n) => '<option value="' + n + '"' + (String(CTL["rf_" + x.id] || fl[0]) === String(n) ? " selected" : "") + ">" + H(FN(n)) + "</option>").join("") + "</select>"
      : "";
    return '<div class="qrow ' + cls + '"><div class="t">' + H(x.sim || "--") + (x.mel_real ? "<small>real " + H(x.mel_real) + "</small>" : "") + "</div>" +
      '<div><div class="ti"><span class="id">' + H(x.id) + "</span> " + H(x.title) + '</div><div class="meta">' + fl.map(floorChip).join("") + travelChips(x) + prChip(x.priority) + (x.wall ? '<span class="chip wl">MOC screen</span>' : "") + badge +
      '<span class="muted">' + H(x.lead || "") + "</span>" + (x.note ? ' <span class="chip" title="' + H(x.note) + '" style="background:var(--amberL)">Note</span>' : "") + "</div></div>" +
      '<div class="act">' + pick + '<button class="pink sm" data-c="release" data-id="' + H(x.id) + '">Release</button>' +
      '<div class="row" style="gap:4px"><button class="sm ghost" data-c="prio" data-id="' + H(x.id) + '" title="Change priority">A/B</button><button class="sm ghost" data-c="detail" data-id="' + H(x.id) + '">Open</button></div></div></div>';
  }).join("") : '<div class="empty">The queue is empty for this filter.</div>';

  // live board
  const now = API.now();
  const cardHtml = (x) => {
    const lu = lastUpdate(x.id), n = countUpdates(x.id);
    const wait = x.status === "released" ? Math.round((now - new Date(x.released_at)) / 60000) : 0;
    const cls = x.status === "closing" ? "closing" : x.status === "released" ? "wait" + (wait >= CFG.WAIT_WARN ? " old" : "") : "";
    return '<div class="card ' + cls + '"><div class="top"><span class="id">' + H(x.id) + "</span>" + floorChip(x.rel_floor) + stChip(x.status) + prChip(x.priority) + (x.wall ? '<span class="chip wl">MOC screen</span>' : "") + '<span class="sp"></span><span class="muted">' + H(x.sim || "") + "</span></div>" +
      '<div class="ti">' + H(x.title) + "</div>" + ((x.travel || []).length ? '<div style="margin-top:4px">' + travelChips(x) + "</div>" : "") +
      '<div class="times"><span>Released <b>' + fmtT(x.released_at) + "</b></span>" +
      (x.delivered_at ? "<span>Delivered <b>" + fmtT(x.delivered_at) + "</b></span>" : '<span class="no">Not delivered' + (wait ? " (" + wait + " min)" : "") + "</span>") +
      (x.moc_at ? "<span>MOC <b>" + fmtT(x.moc_at) + "</b></span>" : '<span class="no">MOC not informed</span>') +
      "<span>" + n + " update" + (n === 1 ? "" : "s") + "</span>" + ((x.involved || []).filter((f) => f !== x.rel_floor).length ? "<span>Also " + (x.involved || []).filter((f) => f !== x.rel_floor).map(floorChip).join(" ") + "</span>" : "") + "</div>" +
      (lu ? '<div class="last"><b>' + fmtT(lu.at) + "</b> " + evText(lu) + "</div>" : "") +
      '<div class="btns">' + (x.status === "released" ? '<button class="sm" data-c="unrelease" data-id="' + H(x.id) + '">Recall</button>' : "") +
      '<button class="sm teal" data-c="close" data-id="' + H(x.id) + '">' + (x.status === "closing" ? "Confirm close" : "Close") + "</button>" +
      '<button class="sm" data-c="detail" data-id="' + H(x.id) + '">Open</button></div></div>';
  };
  const grp = (t, arr) => (arr.length ? '<div class="grp">' + t + " (" + arr.length + ")</div>" + arr.map(cardHtml).join("") : "");
  const closing = I.filter((x) => x.status === "closing"), rel = I.filter((x) => x.status === "released"), play = I.filter((x) => x.status === "inplay").sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  const done = I.filter((x) => x.status === "closed" || x.status === "skipped");
  $("live").innerHTML = (grp("Close requested", closing) + grp("Released, waiting for delivery", rel) + grp("In play", play)) ||
    '<div class="empty">Nothing is live yet. Release an inject from the queue.</div>';
  if (done.length) $("live").innerHTML += '<details><summary>Closed and skipped (' + done.length + ")</summary>" +
    done.map((x) => '<div class="qrow"><div class="t">' + H(x.sim || "") + '</div><div><div class="ti"><span class="id">' + H(x.id) + "</span> " + H(x.title) + '</div><div class="meta">' + stChip(x.status) + floorChip(x.rel_floor) + (x.closed_at ? '<span class="muted">closed ' + fmtT(x.closed_at) + "</span>" : "") + '</div></div><div class="act"><button class="sm ghost" data-c="detail" data-id="' + H(x.id) + '">Open</button></div></div>').join("") + "</details>";
  $("liveN").textContent = closing.length + rel.length + play.length + " live";

  // feed
  const ev = DB.events.filter((e) => CTL.feedFloor === "all" || String(e.floor) === CTL.feedFloor || String(e.target_floor) === CTL.feedFloor).slice(-150).reverse();
  $("feed").innerHTML = ev.length ? ev.map((e) => '<div class="ev' + (newEvIds.has(e.id) ? " new" : "") + '"><b class="tm">' + fmtT(e.at) + (e.game ? '<br><span class="muted">' + H(e.game) + "</span>" : "") + '</b><div><a href="#" data-c="detail" data-id="' + H(e.inject_id) + '" class="id" style="font-size:13px;color:var(--ink)">' + H(e.inject_id) + "</a> " + evText(e) + '<div class="who">' + evWho(e) + "</div></div></div>").join("") : '<div class="empty">The feed is empty. Every action on any floor appears here.</div>';
  newEvIds.clear();
}
function drawOnline() {
  const el = $("online"); if (!el) return;
  el.innerHTML = CFG.FLOORS.map((f) => {
    const ppl = presence.filter((p) => p.role === "floor" && p.floor === f.n);
    return '<span class="chip' + (ppl.length ? " on" : "") + '" title="' + H(ppl.map((p) => p.name).join(", ")) + '"><i></i>' + H(FS(f.n)) + (ppl.length ? " " + H(ppl.map((p) => p.name).join(", ")) : "") + "</span>";
  }).join("") + (DEMO ? "" : "");
}
async function ctlClick(e) {
  const b = e.target.closest("[data-c]"); if (!b) return;
  e.preventDefault();
  const c = b.dataset.c, id = b.dataset.id;
  if (c === "detail") return detailModal(id);
  if (c === "release") { b.disabled = true; const x = DB.by[id]; const fl = CTL["rf_" + id] || (x.floors || [])[0]; const r = await act("release", id, { floor: fl ? String(fl) : null }, null); if (r) toast("Inject " + id + " released to " + FN(fl) + "."); else b.disabled = false; return; }
  if (c === "unrelease") return act("unrelease", id, {}, null);
  if (c === "close") return closeModalFor(id);
  if (c === "prio") { const x = DB.by[id]; const nx = x.priority === "A" ? "B" : x.priority === "B" ? "" : "A"; return act("priority", id, { p: nx }, null); }
  if (c === "sound") { SND.on = !SND.on; SND.unlock(); return renderControl(); }
  if (c === "export") return exportXlsx();
  if (c === "adhoc") return adhocModal();
  if (c === "reset" && DEMO) { API.reset(); lastEv = -1; return refresh(); }
}
function adhocModal() {
  modal('<h3>Ad hoc inject</h3><p class="muted">Use this for Plan B or C, or for something the players create. It gets an X number.</p>' +
    '<label class="f">Title</label><input type="text" id="aT" placeholder="For example: second fire alarm in Hall 5">' +
    '<label class="f">Floor</label><select id="aF">' + CFG.FLOORS.map((f) => '<option value="' + f.n + '">' + H(FN(f.n)) + " · " + H(f.label) + "</option>").join("") + "</select>" +
    '<label class="f">Lead department (optional)</label><input type="text" id="aL">' +
    '<label class="f">Note for the floor manager (optional)</label><textarea id="aN"></textarea>' +
    '<div class="foot"><button class="ghost" id="mx">Cancel</button><button id="aQ">Add to queue</button><button class="pink" id="aR">Create and release now</button></div>');
  $("mx").onclick = closeModal;
  const go = async (rel) => {
    const t = $("aT").value.trim(); if (!t) { toast("Give it a title.", true); return; }
    const g = API.gameMin();
    const r = await act("adhoc", null, { title: t, floor: $("aF").value, lead: $("aL").value.trim(), note: $("aN").value.trim(), sim: g == null ? null : fmtGame(g), simMin: g == null ? null : String(Math.floor(g)) }, null);
    if (!r) return;
    if (rel) await act("release", r.id, { floor: $("aF").value }, null);
    closeModal(); toast("Ad hoc inject " + r.id + (rel ? " released." : " added to the queue."));
  };
  $("aQ").onclick = () => go(false);
  $("aR").onclick = () => go(true);
}

async function flClick(e) {
  const b = e.target.closest("[data-f]"); if (!b || !b.dataset.f) return;
  const c = b.dataset.f, id = b.dataset.id;
  if (c === "deliver") return deliverModal(id);

  if (c === "suggest") return suggestModal(id);
  if (c === "detail") return detailModal(id);

}

    return;
  }
  $("app").innerHTML = '<div class="gate"><img src="' + LOGO + '" alt=""><h2>SIM1 inject tracker</h2><p class="muted">Sign in once on this device.' + (DEMO ? " Demo mode: any PIN works for a floor, and the PIN <b>control</b> opens SIM Control." : "") + "</p>" +
    '<label class="f">I am</label><select id="gView"><option value="floor">A floor manager</option><option value="control">SIM Control</option></select>' +
    '<div id="gFloorW"><label class="f">My floor</label><select id="gFloor">' + CFG.FLOORS.map((f) => '<option value="' + f.n + '">' + H(FN(f.n)) + " · " + H(f.label) + "</option>").join("") + "</select></div>" +
    '<label class="f">My name</label><input type="text" id="gName" placeholder="For example: Ilkin" autocomplete="name">' +
    '<label class="f">PIN</label><input type="password" id="gPin" autocomplete="current-password">' +
    '<div class="err" id="gErr">' + H(msg || "") + '</div><div class="row" style="margin-top:8px"><span class="sp"></span><button class="ink big" id="gGo">Start</button></div></div>';
  $("gView").value = wantView; if (wantFloor) $("gFloor").value = wantFloor;
  const anyName = (lsRead(lsKey(last.view, last.floor)) || {}).name; if (anyName) $("gName").value = anyName;
  const sync = () => ($("gFloorW").style.display = $("gView").value === "floor" ? "" : "none");
  $("gView").onchange = sync; sync();
  $("gPin").onkeydown = (e) => { if (e.key === "Enter") $("gGo").click(); };
  $("gGo").onclick = () => {
    const s = { view: $("gView").value, floor: +$("gFloor").value, name: $("gName").value.trim(), pin: $("gPin").value.trim() };
    if (!s.name) { $("gErr").textContent = "Please type your name."; return; }
    if (!s.pin) { $("gErr").textContent = "Please type the PIN."; return; }
    login(s, $("gGo"));
  };
}
async function login(s, btn) {
  SND.unlock();
  btn.disabled = true;
  let role = null;
  try { role = await API.check(s.pin); } catch (e) { $("gErr").textContent = "Cannot reach the database. Check the Wi-Fi and try again."; btn.disabled = false; return; }
  if (!role) { $("gErr").textContent = "The PIN is not right."; btn.disabled = false; return; }
  if (s.view === "control" && role !== "control") { $("gErr").textContent = "This PIN is for floor managers. Ask SIM Control for the SIM Control PIN."; btn.disabled = false; return; }
  localStorage.setItem(lsKey(s.view, s.floor), JSON.stringify(s)); localStorage.setItem(LS + ":last", JSON.stringify({ view: s.view, floor: s.floor }));
  ME.role = role; ME.view = s.view; ME.floor = s.view === "floor" ? s.floor : null; ME.name = s.name; ME.pin = s.pin;
  if (API.setPin) API.setPin(s.pin);
  const u = new URL(location.href);
  if (ME.view === "floor") { u.searchParams.set("floor", ME.floor); u.searchParams.delete("view"); } else { u.searchParams.set("view", "control"); u.searchParams.delete("floor"); }
  history.replaceState(null, "", u);
  try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {}
  document.addEventListener("visibilitychange", async () => { try { if (!document.hidden && navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {} });
  booted = true;
  API.start();
  API.track({ role: ME.view === "control" ? "control" : "floor", floor: ME.floor, name: ME.name });
  await refresh();
  if (ME.view === "floor") {
    // On first load, show pop-ups for anything already released to this floor and not yet opened.
    DB.injects.filter((x) => x.status === "released" && x.rel_floor === ME.floor && !evsFor(x.id).some((e) => e.kind === "ack" && e.floor === ME.floor)).forEach((x) => POP.push(x.id));
    showPop();
  }
}
gate();
</script>
